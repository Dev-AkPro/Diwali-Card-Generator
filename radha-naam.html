<body>

<script>
const HISTORY_PREFIX = 'radha_japa_day_';
const MAX_HISTORY_DAYS = 365;
const names=["राधा","रासेश्वरी","रम्या","कृष्णमत्राधिदेवता","सर्वाद्या","सर्ववन्द्या","वृन्दावनविहारिणी","वृन्दाराध्या","रमा","अशेषगोपीमण्डलपूजिता","सत्या","सत्यपरा","सत्यभामा","श्रीकृष्णवल्लभा","वृषभानुसुता","गोपी","मूल प्रकृति","ईश्वरी","गान्धर्वा","राधिका","रम्या","रुक्मिणी","परमेश्वरी","परात्परतरा","पूर्णा","पूर्णचन्द्रविमानना","भुक्ति- मुक्तिप्रदा","भावव्याधि-विनाशिनी"];
const countBox=document.getElementById('countBox'),malasEl=document.getElementById('malas'),totalEl=document.getElementById('total'),todayEl=document.getElementById('today'),progress=document.getElementById('progress'),timerEl=document.getElementById('timerText'),startPrompt=document.getElementById('startPrompt');
const dayTimeText=document.getElementById('dayTimeText');
const deitySelect=document.getElementById('deitySelect');
const headerEl=document.querySelector('header');
const streakText=document.getElementById('streakText');
const setGoalBtn=document.getElementById('setGoal');
const shareBtn=document.getElementById('shareBtn');
const exportBtn=document.getElementById('exportBtn');
const importBtn=document.getElementById('importBtn');
const importFile=document.getElementById('importFile');
const numberFormatter=new Intl.NumberFormat('hi-IN');
const ISTFormatter=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'});
const DisplayFormatter=new Intl.DateTimeFormat('hi-IN',{timeZone:'Asia/Kolkata',day:'2-digit',month:'short',year:'numeric'});
const KEY='radha_japa_history_v2';
let state={count:1,malas:0,total:0,today:0,todayMs:0,startTime:null,lastTickMs:null,timerRunning:false,lastDate:getISTDateString(),selectedDeity:'राधा',dailyGoal:108,streak:0,bestStreak:0};
function getISTDateString(date=new Date()){return ISTFormatter.format(date);}
function parseISTDate(dateString){return new Date(`${dateString}T00:00:00+05:30`);}
function calculateAllTimeTotal(includeCurrent=true){let total=0;const todayKey=getISTDateString();let todayCovered=false;for(let i=0;i<MAX_HISTORY_DAYS;i++){const date=new Date();date.setDate(date.getDate()-i);const key=HISTORY_PREFIX+getISTDateString(date);const raw=localStorage.getItem(key);if(!raw)continue;try{const data=JSON.parse(raw);const value=Number(data?.total)||0;total+=value;if(key===HISTORY_PREFIX+todayKey)todayCovered=true;}catch(e){}}if(includeCurrent&&state.today&&!todayCovered){total+=Number(state.today)||0;}return total;}
function refreshTotalsFromHistory(){const historyTotal=calculateAllTimeTotal(false);state.total=Math.max(Number(state.total)||0,historyTotal,Number(state.today)||0);}
function ensureTodaySync(){const todayKey=getISTDateString();if(state.lastDate!==todayKey){const yesterdayDate=new Date();yesterdayDate.setDate((new Date()).getDate()-1);const yKey=HISTORY_PREFIX+getISTDateString(yesterdayDate);let yHadActivity=false;try{const yRaw=localStorage.getItem(yKey);if(yRaw){const y=JSON.parse(yRaw);yHadActivity=(Number(y?.total)||0)>0||(Number(y?.totalMs)||0)>0;}}catch(e){}
  state.streak = yHadActivity ? (Number(state.streak)||0)+1 : 0;
  if(state.streak>state.bestStreak) state.bestStreak=state.streak;
  state.lastDate=todayKey;state.today=0;state.todayMs=0;state.count=1;state.startTime=null;state.lastTickMs=null;state.timerRunning=false;refreshTotalsFromHistory();return true;}return false;}
function load(){try{const stored=localStorage.getItem(KEY);if(stored){const data=JSON.parse(stored);state.count=Number(data.state?.count)||1;state.malas=Number(data.state?.malas)||0;state.total=Number(data.state?.total)||0;state.today=Number(data.state?.today)||0;state.todayMs=Number(data.state?.todayMs)||0;state.lastDate=data.state?.lastDate||getISTDateString();state.selectedDeity=(data.state?.selectedDeity)||'राधा';state.dailyGoal=Number(data.state?.dailyGoal)||108;state.streak=Number(data.state?.streak)||0;state.bestStreak=Number(data.state?.bestStreak)||0;}}catch(e){}ensureTodaySync();refreshTotalsFromHistory();}
function render(){countBox.textContent=numberFormatter.format(state.count);malasEl.textContent=numberFormatter.format(state.malas);totalEl.textContent=numberFormatter.format(state.total);todayEl.textContent=numberFormatter.format(state.today);progress.style.strokeDashoffset=String(251.2-251.2*((state.count-1)/108));startPrompt.style.display=state.timerRunning?'none':'block';if(!state.timerRunning||!state.startTime){timerEl.textContent='00:00:00';}else{timerEl.textContent=fmt(Date.now()-state.startTime);}const mins=Math.round((Number(state.todayMs)||0)/60000);if(dayTimeText)dayTimeText.textContent=`आज: ${numberFormatter.format(mins)} मिनट`;if(deitySelect){deitySelect.value=state.selectedDeity;}if(headerEl){headerEl.textContent=state.selectedDeity+" नाम जप";}if(streakText){streakText.textContent=`Streak: ${numberFormatter.format(state.streak)} 🔥 | Best: ${numberFormatter.format(state.bestStreak)}`;}}
function saveDay(){const dayKey=HISTORY_PREFIX+(state.lastDate||getISTDateString());if(state.today||state.todayMs||localStorage.getItem(dayKey)){localStorage.setItem(dayKey,JSON.stringify({total:Number(state.today)||0,malas:Number(state.malas)||0,totalMs:Number(state.todayMs)||0,updated:Date.now()}));}}
function save(){try{state.lastDate=getISTDateString();saveDay();refreshTotalsFromHistory();localStorage.setItem(KEY,JSON.stringify({state:{count:state.count,malas:state.malas,total:state.total,today:state.today,todayMs:state.todayMs,lastDate:state.lastDate,selectedDeity:state.selectedDeity,dailyGoal:state.dailyGoal,streak:state.streak,bestStreak:state.bestStreak}}));}catch(e){}}
function createFloatingName(x,y){const el=document.createElement('div');el.className='floating-name';el.textContent=state.selectedDeity||'जप';el.style.left=x+'px';el.style.top=y+'px';document.body.appendChild(el);setTimeout(()=>el.remove(),1000);}
function increment(){ensureTodaySync();const now=Date.now();if(!state.timerRunning){state.startTime=now;state.lastTickMs=now;state.timerRunning=true;if(state.audioEnabled){mantraAudio.play().catch(()=>{});}}else if(state.lastTickMs){state.todayMs+=Math.max(0, now-state.lastTickMs);state.lastTickMs=now;}state.count++;state.total++;state.today++;if(state.count>108){state.malas++;state.count=1;if('vibrate' in navigator){navigator.vibrate?.(30);}}save();render();}
function fmt(ms){if(!ms)return'00:00:00';const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return(h>0?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
load();render();
window.addEventListener('pointerdown',e=>{const tag=e.target.tagName.toLowerCase();if(['button','i','span'].includes(tag)||e.target.closest('button')||e.target.closest('.modal'))return;createFloatingName(e.clientX,e.clientY);increment();},{passive:true});
setInterval(()=>{ensureTodaySync();if(state.timerRunning&&state.startTime){const now=Date.now();if(state.lastTickMs){state.todayMs+=Math.max(0, now-state.lastTickMs);}state.lastTickMs=now;timerEl.textContent=fmt(now-state.startTime);render();save();}},1000);
 
document.getElementById('reset').addEventListener('click',()=>{if(confirm('क्या आप काउंटर रीसेट करना चाहते हैं? (Timer और आज का जप शून्य हो जाएगा)')){ensureTodaySync();state.count=1;state.today=0;state.todayMs=0;state.malas=0;state.startTime=null;state.lastTickMs=null;state.timerRunning=false;refreshTotalsFromHistory();save();render();}});
document.getElementById('fullscreen').addEventListener('click',async()=>{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen();});
function closeModal(){document.getElementById('historyModal').style.display='none';}
function closeNames(){document.getElementById('namesModal').style.display='none';}
function showNames(){const modal=document.getElementById('namesModal');const list=document.getElementById('namesList');list.innerHTML='';names.forEach((n,i)=>{const li=document.createElement('li');li.style.padding='8px 0';li.style.borderBottom=i<names.length-1?'1px solid #eee':'none';li.textContent=`${i+1}. ${n}`;list.appendChild(li);});modal.style.display='flex';}
function showHistory(){const modal=document.getElementById('historyModal');const list=document.getElementById('historyList');const totalHistory=calculateAllTimeTotal();list.innerHTML=`<div style="text-align:center;color:#555;margin-bottom:12px;font-weight:600;">कुल जप: ${numberFormatter.format(totalHistory)}</div>`;let hasData=false;for(let i=0;i<MAX_HISTORY_DAYS;i++){const date=new Date();date.setDate(date.getDate()-i);const keyDate=getISTDateString(date);const key=HISTORY_PREFIX+keyDate;const raw=localStorage.getItem(key);if(!raw)continue;let data;try{data=JSON.parse(raw);}catch(e){continue;}const totalForDay=Number(data?.total)||0;const malasForDay=Number(data?.malas)||0;const msForDay=Number(data?.totalMs)||0;const minsForDay=Math.round(msForDay/60000);if(totalForDay<=0&&malasForDay<=0&&minsForDay<=0)continue;hasData=true;const displayDate=DisplayFormatter.format(parseISTDate(keyDate));const div=document.createElement('div');div.style.margin='8px 0';div.style.padding='10px';div.style.background='#fff';div.style.borderRadius='10px';div.style.boxShadow='var(--shadow-light)';div.style.border='1px solid rgba(240,138,26,0.12)';div.innerHTML=`<strong>${displayDate}</strong><br/><span style="color:var(--accent-dark)">जप: ${numberFormatter.format(totalForDay)}</span> • <span style="color:var(--accent)">माला: ${numberFormatter.format(malasForDay)}</span> • <span style="color:#555">समय: ${numberFormatter.format(minsForDay)} मिनट</span>`;list.appendChild(div);}if(!hasData){list.innerHTML+='<div style="text-align:center;color:#999;padding:20px">अभी तक कोई इतिहास नहीं है</div>';}
  modal.style.display='flex';}
document.getElementById('showNames').addEventListener('click',showNames);
document.getElementById('leader').addEventListener('click',showHistory);
if(deitySelect){deitySelect.addEventListener('change',()=>{state.selectedDeity=deitySelect.value||'राधा';save();render();});}
window.addEventListener('focus',()=>{const rolled=ensureTodaySync();if(rolled)save();render();});
window.addEventListener('beforeunload',save);
if(setGoalBtn){setGoalBtn.addEventListener('click',()=>{const v=prompt('Daily Goal (जप)', String(state.dailyGoal||108));if(v!==null){const n=Math.max(0,Math.floor(Number(v)||0));state.dailyGoal=n;save();render();}});}
if(shareBtn){shareBtn.addEventListener('click',async()=>{const text=`${state.selectedDeity} नाम जप\nआज: ${state.today} जप (${Math.round((state.todayMs||0)/60000)} मिनट)\nमाला: ${state.malas}\nकुल: ${state.total}`;const url=location.href;try{if(navigator.share){await navigator.share({title:document.title,text,url});}else{await navigator.clipboard.writeText(`${text}\n${url}`);alert('Copied summary to clipboard!');}}catch(e){}});}
if(exportBtn){exportBtn.addEventListener('click',()=>{const dump={version:2,exportedAt:Date.now(),state,history:{}};for(let i=0;i<MAX_HISTORY_DAYS;i++){const d=new Date();d.setDate(d.getDate()-i);const key=HISTORY_PREFIX+getISTDateString(d);const raw=localStorage.getItem(key);if(raw)dump.history[key]=JSON.parse(raw);}const blob=new Blob([JSON.stringify(dump,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='radha-naam-jap-export.json';a.click();URL.revokeObjectURL(a.href);});}
if(importBtn&&importFile){importBtn.addEventListener('click',()=>importFile.click());importFile.addEventListener('change',async()=>{const f=importFile.files?.[0];if(!f)return;try{const text=await f.text();const data=JSON.parse(text);if(data?.state){Object.assign(state,data.state);}if(data?.history){Object.entries(data.history).forEach(([k,v])=>{localStorage.setItem(k,JSON.stringify(v));});}save();render();alert('Import successful');}catch(e){alert('Import failed');}finally{importFile.value='';}});}
</script>

</center>
